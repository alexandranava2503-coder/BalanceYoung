<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Balance Young</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#035466">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#035466;--brand-d:#024255;--brand-l:#e0f2ec;--accent-d:#22966a;--ink:#0e2a33;--muted:#51656c;--bg:#f8fbfa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);text-align:center;background:radial-gradient(700px 360px at 85% -10%,#d3efe3 0,transparent 60%),radial-gradient(500px 280px at 0% 10%,#d9edf2 0,transparent 60%),var(--bg)}
img{height:64px;width:auto}
.code{font-size:clamp(4rem,14vw,7rem);font-weight:800;letter-spacing:-.05em;line-height:1;margin:18px 0 6px;color:var(--brand)}
.code span{color:var(--accent-d)}
h1{font-size:1.5rem;margin:0 0 8px}
p{color:var(--muted);margin:0 0 26px;max-width:42ch}
a.btn{display:inline-block;font-weight:700;text-decoration:none;background:var(--brand);color:#fff;padding:12px 22px;border-radius:12px}
a.btn:hover{background:var(--brand-d)}
a.btn:focus-visible{outline:3px solid rgba(3,84,102,.45);outline-offset:2px}
</style>
</head>
<body>
<main>
  <img src="/logo-icon.png" alt="Balance Young" width="58" height="64">
  <div class="code" aria-hidden="true">4<span>0</span>4</div>
  <h1>Esta página se salió del presupuesto</h1>
  <p>No encontramos lo que buscabas. Vuelve al inicio y sigue organizando tu dinero.</p>
  <a class="btn" href="/">Volver al inicio</a>
</main>
</body>
</html>
